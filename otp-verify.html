<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP – EBEVON</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 24px 60px;background:radial-gradient(ellipse at top,#1a1200 0%,var(--dark) 60%)}
    .auth-card{background:var(--dark-3);border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:48px 44px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
    .auth-logo img{height:52px;width:52px;object-fit:contain;filter:invert(1) sepia(1) saturate(3) hue-rotate(5deg) brightness(.95);margin:0 auto 10px;display:block}
    .otp-icon{font-size:3rem;color:var(--gold);margin-bottom:16px}
    .otp-inputs{display:flex;gap:10px;justify-content:center;margin:28px 0}
    .otp-input{width:52px;height:64px;text-align:center;font-size:1.6rem;font-weight:900;font-family:var(--font-head);background:var(--dark-4);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);transition:var(--transition)}
    .otp-input:focus{border-color:var(--gold);outline:none;background:rgba(201,168,76,.06)}
    .otp-input.filled{border-color:var(--gold)}
    .timer{font-size:.85rem;color:var(--text-muted);margin-bottom:20px}
    .timer span{color:var(--gold);font-weight:700}
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">
      <img src="../assets/images/logo.jpg" alt="EBEVON" class="logo-img" />
      <span class="logo-text">EBEVON</span>
    </a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="../assets/images/logo.jpg" alt="EBEVON" /></div>
    <div class="otp-icon"><i class="fas fa-shield-check"></i></div>
    <h2 style="color:var(--text);margin-bottom:8px">Verify Your Identity</h2>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:4px">A 6-digit code was sent to</p>
    <p style="color:var(--gold);font-weight:700;font-size:1rem;margin-bottom:8px" id="targetLabel">—</p>

    <div class="otp-inputs" id="otpBoxes"></div>

    <div class="timer">Code expires in <span id="countdown">10:00</span></div>

    <button class="btn-gold" style="width:100%;justify-content:center;padding:15px;font-size:1rem" id="verifyBtn" onclick="verifyCode()">
      <i class="fas fa-check-circle"></i> Verify Code
    </button>

    <p style="margin-top:20px;font-size:.85rem;color:var(--text-muted)">
      Didn't receive it? <a href="#" style="color:var(--gold)" onclick="resendOtp()">Resend Code</a>
    </p>
    <p style="margin-top:8px;font-size:.82rem">
      <a href="login.html" style="color:var(--text-muted)"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </p>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  const params  = new URLSearchParams(location.search);
  const target  = params.get('target') || '';
  const purpose = params.get('purpose') || 'signup';
  const next    = params.get('next') || 'dashboard-buyer.html';

  document.getElementById('targetLabel').textContent = target;

  // Build OTP boxes
  const container = document.getElementById('otpBoxes');
  for (let i = 0; i < 6; i++) {
    const inp = document.createElement('input');
    inp.type='text'; inp.maxLength=1; inp.className='otp-input'; inp.inputMode='numeric';
    inp.addEventListener('input', e => {
      if(e.target.value) { e.target.classList.add('filled'); e.target.nextSibling?.focus(); }
    });
    inp.addEventListener('keydown', e => {
      if (e.key==='Backspace'&&!e.target.value) { e.target.classList.remove('filled'); e.target.previousSibling?.focus(); }
    });
    inp.addEventListener('paste', e => {
      e.preventDefault();
      const pasted = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      [...container.querySelectorAll('.otp-input')].forEach((box,i) => { box.value=pasted[i]||''; if(pasted[i]) box.classList.add('filled'); });
    });
    container.appendChild(inp);
  }
  container.firstChild?.focus();

  // Countdown timer
  let seconds = 10 * 60;
  const countEl = document.getElementById('countdown');
  const timerInterval = setInterval(() => {
    seconds--;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    countEl.textContent = `${m}:${s}`;
    if (seconds <= 0) { clearInterval(timerInterval); countEl.textContent='Expired'; }
  }, 1000);

  async function verifyCode() {
    const code = [...container.querySelectorAll('.otp-input')].map(i=>i.value).join('');
    if (code.length !== 6) { showFlash('Enter all 6 digits','error'); return; }
    const btn = document.getElementById('verifyBtn');
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Verifying…'; btn.disabled=true;
    try {
      const res = await EbevonAPI.OTP.verify(target, code, purpose);
      if (!res?.success) { showFlash(res?.message||'Invalid code','error'); return; }
      if (res.data?.accessToken) EbevonAPI.Auth.saveSession(res.data);
      clearInterval(timerInterval);
      showFlash('Verified successfully!');
      setTimeout(() => window.location.href = next, 800);
    } finally { btn.innerHTML='<i class="fas fa-check-circle"></i> Verify Code'; btn.disabled=false; }
  }

  async function resendOtp() {
    const res = await EbevonAPI.OTP.send(target, purpose);
    showFlash(res?.success ? 'New code sent!' : (res?.message||'Failed to resend'), res?.success?'success':'error');
    if (res?.success) { seconds = 10*60; }
  }
</script>
</body>
</html>
